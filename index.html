<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Músicas</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#121212">
<style>
:root{--bg:#121212;--card:#1e1e1e;--tx:#f2f2f2;--mu:#9a9a9a;--ac:#1db954}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding-bottom:190px}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}h1{margin:0;font-size:22px}
#cfg{background:none;border:0;color:var(--tx);font-size:24px}
.tabs{display:flex;gap:6px}.tabs button,.add,.btn{flex:1;padding:10px;border:0;border-radius:20px;background:var(--card);color:var(--tx);font-size:14px}
.tabs button.on{background:var(--ac);color:#000;font-weight:700}
.add{display:block;margin:10px 0 0;text-align:center;background:#2a2a2a;font-size:15px}
.sr{display:flex;gap:8px;margin-top:10px}.search,select{padding:10px 14px;border:0;border-radius:20px;background:var(--card);color:var(--tx);font-size:14px}.search{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:4px;padding:12px 16px;border-bottom:1px solid #222}
.row.cur{background:#1a2a1f}.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.cur .t{color:var(--ac)}.row button{background:none;border:0;color:var(--mu);font-size:22px;padding:6px}
.row .star.on{color:#ffc107}.empty{padding:40px 16px;color:var(--mu);text-align:center}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);padding:12px 16px;border-top:1px solid #333}
.np{display:flex;align-items:center;gap:10px;margin-bottom:6px}#cov{width:44px;height:44px;border-radius:6px;object-fit:cover}
#now{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%}.time{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px}
.ctl button{background:none;border:0;color:var(--mu);font-size:26px}.ctl button.on{color:var(--ac)}.ctl #prev,.ctl #next{color:var(--tx);font-size:30px}
.ctl .p{background:var(--ac)!important;color:#000!important;border-radius:50%;width:54px;height:54px;font-size:24px}
dialog{background:var(--card);color:var(--tx);border:0;border-radius:16px;width:90%;max-width:420px}dialog::backdrop{background:#000a}
dialog .btn{display:block;width:100%;margin-top:8px;background:#2a2a2a;text-align:center}#st,small{white-space:pre-line;color:var(--mu)}
</style></head><body>
<header><div class="top"><h1>🎵 Músicas</h1><button id="cfg">⚙</button></div>
<div class="tabs"><button id="tAll" class="on">Todas</button><button id="tFav">⭐ Favoritas</button><button id="tPl">📁 Listas</button></div>
<label class="add">＋ Adicionar músicas do celular<input id="file" type="file" accept="audio/*" multiple hidden></label>
<div class="sr"><input id="q" class="search" type="search" placeholder="🔍 Buscar música"><select id="sort"><option value="add">Ordem adicionada</option><option value="new">Mais recentes</option><option value="name">Nome A–Z</option><option value="fav">Favoritas primeiro</option></select></div></header>
<div id="prog" hidden style="padding:8px 16px;background:var(--card)"><small id="pt"></small><progress id="pg" value="0" style="width:100%"></progress></div>
<div id="list"></div>
<div id="bar"><div class="np"><img id="cov" alt="" hidden><div id="now">Nenhuma música</div></div>
<input id="seek" type="range" min="0" max="0" value="0" step="0.1">
<div class="time"><span id="cu">0:00</span><span id="du">0:00</span></div>
<div class="ctl"><button id="shuf">🔀</button><button id="prev">⏮</button><button id="pp" class="p">▶</button><button id="next">⏭</button><button id="rep">🔁</button></div></div>
<audio id="a"></audio>
<dialog id="dc"><h3>Configurações</h3><p id="st"></p><button id="sl" class="btn"></button>
<button id="ex" class="btn">⬇ Exportar favoritas e listas</button><label class="btn">⬆ Importar backup<input id="im" type="file" accept=".json,application/json" hidden></label>
<small>O backup guarda favoritas e listas, não as músicas. Para restaurar, adicione as músicas de novo e importe.</small><button class="btn" onclick="this.closest('dialog').close()">Fechar</button></dialog>
<dialog id="dm"><h3 id="mt"></h3><div id="mb"></div><button class="btn" onclick="this.closest('dialog').close()">Fechar</button></dialog>
<script>
/*LOGIC*/
const Q={next:(i,n)=>n?(i+1)%n:-1,prev:(i,n)=>n?(i-1+n)%n:-1,
 after:(i,n,m)=>!n?-1:m==='one'?i:(i+1<n?i+1:(m==='all'?0:-1)),
 shuffle:(ids,f)=>{const r=ids.filter(x=>x!==f);for(let k=r.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[r[k],r[j]]=[r[j],r[k]]}return ids.includes(f)?[f,...r]:r},
 dup:(l,n,z)=>l.some(s=>s.name===n&&s.blob.size===z),
 sort:(v,m,lb)=>{v=[...v];if(m==='name')v.sort((x,y)=>lb(x).localeCompare(lb(y),'pt'));else if(m==='fav')v.sort((x,y)=>(y.fav?1:0)-(x.fav?1:0)||x.id-y.id);else if(m==='new')v.sort((x,y)=>y.id-x.id);else v.sort((x,y)=>x.id-y.id);return v}};
function parseID3(buf){if(!buf)return null;const d=new Uint8Array(buf);if(d.length<10||String.fromCharCode(d[0],d[1],d[2])!=='ID3')return null;
 const ver=d[3],ss=(b,o)=>(b[o]<<21)|(b[o+1]<<14)|(b[o+2]<<7)|b[o+3];
 const dec=(b,e)=>{try{let c=e===0?'iso-8859-1':e===1?'utf-16':e===2?'utf-16be':'utf-8';if(e===1&&b[0]===0xFE&&b[1]===0xFF)c='utf-16be';return new TextDecoder(c).decode(b).replace(/\0+$/,'').trim()}catch(x){return''}};
 let o=10;const end=Math.min(d.length,10+ss(d,6));
 if(d[5]&0x40)o+=ver===4?ss(d,10):(((d[10]<<24)|(d[11]<<16)|(d[12]<<8)|d[13])+4);
 const r={};
 while(o+10<=end){const id=String.fromCharCode(d[o],d[o+1],d[o+2],d[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
  const sz=ver===4?ss(d,o+4):((d[o+4]<<24)|(d[o+5]<<16)|(d[o+6]<<8)|d[o+7]);if(sz<=0||o+10+sz>d.length)break;
  const f=d.subarray(o+10,o+10+sz),e=f[0];
  if(id==='TIT2')r.title=dec(f.subarray(1),e);else if(id==='TPE1')r.artist=dec(f.subarray(1),e);
  else if(id==='APIC'&&!r.cover){let p=1;while(p<f.length&&f[p]!==0)p++;const mime=dec(f.subarray(1,p),0);p+=2;
   if(e===1||e===2){while(p+1<f.length&&!(f[p]===0&&f[p+1]===0))p+=2;p+=2}else{while(p<f.length&&f[p]!==0)p++;p++}
   if(p<f.length)r.cover={mime:mime||'image/jpeg',bytes:f.slice(p)}}
  o+=10+sz}
 return r}
/*END*/
const $=id=>document.getElementById(id),a=$('a');
let songs=[],tab='all',curPl=null,queue=[],qi=-1,curId=null,url=null,cv=null,term='',shuf=false,rep='all',sort='add',lastSave=0,sleepAt=0,sleepIdx=0,pls={};
try{const c=JSON.parse(localStorage.getItem('cfg')||'{}');shuf=!!c.shuf;if(c.rep)rep=c.rep;if(c.sort)sort=c.sort;pls=JSON.parse(localStorage.getItem('pls')||'{}')}catch(e){}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const saveCfg=()=>{try{localStorage.setItem('cfg',JSON.stringify({shuf,rep,sort}))}catch(e){}};
const saveP=()=>{try{localStorage.setItem('pls',JSON.stringify(pls))}catch(e){}};
const saveLast=()=>{if(curId==null)return;try{localStorage.setItem('last',JSON.stringify({id:curId,t:a.currentTime}))}catch(e){}};
const paintCtl=()=>{$('shuf').className=shuf?'on':'';$('rep').className=rep==='off'?'':'on';$('rep').textContent=rep==='one'?'🔂':'🔁';$('sort').value=sort};
const label=s=>s.title?(s.artist?s.title+' — '+s.artist:s.title):s.name;
const key=s=>s.name+'|'+s.blob.size;
const mb=b=>b>=1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB';
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
const dbOpen=()=>new Promise((ok,er)=>{const r=indexedDB.open('musicas',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=er});
let db;const tx=(m,f)=>new Promise((ok,er)=>{const t=db.transaction('s',m),s=t.objectStore('s'),r=f(s);t.oncomplete=()=>ok(r.result);t.onerror=er});
const load=async()=>{songs=await tx('readonly',s=>s.getAll());render()};
function visible(){let v=songs;if(tab==='fav')v=v.filter(s=>s.fav);else if(tab==='pl')v=v.filter(s=>(pls[curPl]||[]).includes(s.id));
 if(term){const t=norm(term);v=v.filter(s=>norm(label(s)+' '+s.name).includes(t))}
 return Q.sort(v,sort,label)}
const build=f=>{const ids=visible().map(s=>s.id);return shuf?Q.shuffle(ids,f):ids};
const el=(h,c)=>{const r=document.createElement('div');r.className=c||'row';r.innerHTML=h;return r};
function render(){const l=$('list');l.innerHTML='';
 ['tAll','tFav','tPl'].forEach((id,i)=>$(id).className=['all','fav','pl'][i]===tab?'on':'');
 if(tab==='pl'&&curPl===null){Object.keys(pls).forEach(n=>{const r=el('<span class="t"></span><button>🗑</button>');
  r.firstChild.textContent='📁 '+n+' ('+pls[n].filter(i=>songs.some(s=>s.id===i)).length+')';r.firstChild.onclick=()=>{curPl=n;render()};
  r.lastChild.onclick=()=>{if(confirm('Apagar a lista "'+n+'"? As músicas não são apagadas.')){delete pls[n];saveP();render()}};l.appendChild(r)});
  const nw=el('<span class="t">＋ Nova lista</span>');nw.onclick=()=>{const n=(prompt('Nome da lista:')||'').trim();if(n){pls[n]=pls[n]||[];saveP();render()}};l.appendChild(nw);return}
 if(tab==='pl'){const b=el('<span class="t"></span>');b.firstChild.textContent='← Listas  •  '+curPl;b.onclick=()=>{curPl=null;render()};l.appendChild(b)}
 const v=visible();
 if(!v.length){l.appendChild(el(term?'Nenhuma música encontrada.':tab==='fav'?'Marque músicas com ☆ para elas aparecerem aqui.':tab==='pl'?'Lista vazia. Use ⋯ numa música para adicionar.':'Toque em “Adicionar músicas” e escolha os arquivos baixados.','empty'));return}
 v.forEach(s=>{const r=el('<span class="t"></span><button class="star'+(s.fav?' on':'')+'">'+(s.fav?'★':'☆')+'</button><button class="mn">⋯</button><button class="del">🗑</button>');
 if(s.id===curId)r.classList.add('cur');
 const t=r.querySelector('.t');t.textContent=label(s);t.onclick=()=>play(s.id,true);
 r.querySelector('.star').onclick=async()=>{s.fav=!s.fav;await tx('readwrite',st=>st.put(s));render()};
 r.querySelector('.mn').onclick=()=>menu(s);
 r.querySelector('.del').onclick=async()=>{if(!confirm('Remover "'+label(s)+'"?'))return;await tx('readwrite',st=>st.delete(s.id));for(const n in pls)pls[n]=pls[n].filter(i=>i!==s.id);saveP();if(s.id===curId){a.pause();a.removeAttribute('src');curId=null;$('now').textContent='Nenhuma música';$('cov').hidden=true}await load()};
 l.appendChild(r)})}
function menu(s){$('mt').textContent=label(s);const b=$('mb');b.innerHTML='';
 Object.keys(pls).forEach(n=>{const x=document.createElement('button');x.className='btn';const on=pls[n].includes(s.id);x.textContent=(on?'✓ ':'＋ ')+n;
  x.onclick=()=>{pls[n]=on?pls[n].filter(i=>i!==s.id):[...pls[n],s.id];saveP();render();menu(s)};b.appendChild(x)});
 const nw=document.createElement('button');nw.className='btn';nw.textContent='＋ Nova lista…';
 nw.onclick=()=>{const n=(prompt('Nome da lista:')||'').trim();if(!n)return;pls[n]=pls[n]||[];if(!pls[n].includes(s.id))pls[n].push(s.id);saveP();render();menu(s)};b.appendChild(nw);
 if(!$('dm').open)$('dm').showModal()}
function showNow(s){$('now').textContent=label(s);if(cv)URL.revokeObjectURL(cv);cv=s.cover?URL.createObjectURL(s.cover):null;$('cov').hidden=!cv;if(cv)$('cov').src=cv;
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.title||s.name,artist:s.artist||'Músicas',artwork:cv?[{src:cv}]:[]})}
function play(id,fresh){if(fresh)queue=build(id);qi=queue.indexOf(id);if(qi<0)return;const s=songs.find(x=>x.id===id);if(!s)return;
 curId=id;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(s.blob);a.src=url;a.play().catch(()=>{});showNow(s);render()}
const goNext=()=>{const i=Q.next(qi,queue.length);if(i>=0)play(queue[i])};
const goPrev=()=>{if(a.currentTime>3){a.currentTime=0;return}const i=Q.prev(qi,queue.length);if(i>=0)play(queue[i])};
a.addEventListener('ended',()=>{const i=Q.after(qi,queue.length,rep);if(i<0)return;if(i===qi){a.currentTime=0;a.play()}else play(queue[i])});
a.addEventListener('error',()=>setTimeout(goNext,300));
a.addEventListener('timeupdate',()=>{checkSleep();if(Date.now()-lastSave>2000){lastSave=Date.now();saveLast()}$('seek').value=a.currentTime;$('cu').textContent=fmt(a.currentTime)});
a.addEventListener('loadedmetadata',()=>{$('seek').max=a.duration;$('du').textContent=fmt(a.duration)});
a.addEventListener('play',()=>$('pp').textContent='⏸');a.addEventListener('pause',()=>{$('pp').textContent='▶';saveLast()});document.addEventListener('visibilitychange',saveLast);
$('seek').oninput=e=>a.currentTime=e.target.value;
$('pp').onclick=()=>{if(!a.src){const v=visible();if(v.length)play(v[0].id,true);return}a.paused?a.play():a.pause()};
$('next').onclick=goNext;$('prev').onclick=goPrev;
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('nexttrack',goNext);m.setActionHandler('previoustrack',goPrev);m.setActionHandler('play',()=>a.play());m.setActionHandler('pause',()=>a.pause())}
const setTab=t=>{tab=t;curPl=null;render()};$('tAll').onclick=()=>setTab('all');$('tFav').onclick=()=>setTab('fav');$('tPl').onclick=()=>setTab('pl');
$('q').oninput=e=>{term=e.target.value;render()};
$('sort').onchange=e=>{sort=e.target.value;saveCfg();render()};
$('shuf').onclick=()=>{shuf=!shuf;saveCfg();paintCtl();if(curId!=null){queue=build(curId);qi=queue.indexOf(curId)}};
$('rep').onclick=()=>{rep=rep==='all'?'one':rep==='one'?'off':'all';saveCfg();paintCtl()};
async function readHead(b){const h=new Uint8Array(await b.slice(0,10).arrayBuffer());if(String.fromCharCode(h[0],h[1],h[2])!=='ID3')return null;return b.slice(0,Math.min(((h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9])+10,12e6)).arrayBuffer()}
async function tagAll(){let ch=false;for(const s of songs){if(s.tagged)continue;try{const t=parseID3(await readHead(s.blob));if(t){if(t.title)s.title=t.title;if(t.artist)s.artist=t.artist;if(t.cover)s.cover=new Blob([t.cover.bytes],{type:t.cover.mime})}}catch(e){}s.tagged=1;await tx('readwrite',st=>st.put(s));ch=true}if(ch){render();const c=songs.find(x=>x.id===curId);if(c)showNow(c)}}
const txMany=rows=>new Promise((ok,er)=>{const t=db.transaction('s','readwrite'),s=t.objectStore('s');rows.forEach(r=>{const q=s.add(r);q.onsuccess=()=>{r.id=q.result}});t.oncomplete=ok;t.onerror=t.onabort=()=>er(t.error)});
$('file').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;
 let add=0,dup=0,fail=0,wl=null;const seen=new Set(songs.map(key));
 try{wl=await navigator.wakeLock.request('screen')}catch(_){}
 $('prog').hidden=false;$('pg').max=files.length;$('pg').value=0;$('pt').textContent='Preparando '+files.length+' arquivo(s)…';
 for(let i=0;i<files.length;i+=20){const part=[];
  for(const f of files.slice(i,i+20)){const n=f.name.replace(/\.[^.]+$/,'');const k=n+'|'+f.size;if(seen.has(k)){dup++;continue}seen.add(k);part.push({f,n})}
  const rows=await Promise.all(part.map(async({f,n})=>{const row={name:n,blob:f,fav:false,tagged:1};try{const t=parseID3(await readHead(f));if(t){if(t.title)row.title=t.title;if(t.artist)row.artist=t.artist;if(t.cover)row.cover=new Blob([t.cover.bytes],{type:t.cover.mime})}}catch(_){}return row}));
  try{await txMany(rows);songs.push(...rows);add+=rows.length}catch(_){fail=files.length-i;break}
  const d=Math.min(i+20,files.length);$('pg').value=d;$('pt').textContent='Adicionando '+d+' de '+files.length+'…';render()}
 $('prog').hidden=true;if(wl)wl.release().catch(()=>{});render();
 alert(add+' adicionada(s)'+(dup?' • '+dup+' já existia(m)':'')+(fail?' • parou por falta de espaço ou erro; as que faltam podem ser adicionadas de novo':''))};
function restore(){try{const l=JSON.parse(localStorage.getItem('last')||'null');const s=l&&songs.find(x=>x.id===l.id);if(!s)return;queue=build(s.id);qi=queue.indexOf(s.id);curId=s.id;url=URL.createObjectURL(s.blob);a.addEventListener('loadedmetadata',()=>{a.currentTime=l.t||0},{once:true});a.src=url;showNow(s);render()}catch(e){}}
/* temporizador, espaço e backup */
const SL=[0,15,30,45,60];
function sleepLabel(){$('sl').textContent=sleepAt?'😴 Dormir: faltam '+Math.max(1,Math.ceil((sleepAt-Date.now())/60000))+' min (toque para mudar)':'😴 Temporizador: desligado (toque para ligar)'}
function checkSleep(){if(sleepAt&&Date.now()>=sleepAt){a.pause();sleepAt=0;sleepIdx=0;sleepLabel()}}
$('sl').onclick=()=>{sleepIdx=(sleepIdx+1)%SL.length;sleepAt=SL[sleepIdx]?Date.now()+SL[sleepIdx]*60000:0;sleepLabel()};
setInterval(()=>{checkSleep();if($('dc').open)sleepLabel()},5000);
async function info(){const sum=songs.reduce((t,s)=>t+s.blob.size,0);let x=songs.length+' música(s) • '+mb(sum);try{const e=await navigator.storage.estimate();x+='\nEspaço ainda disponível para o app: ~'+mb(e.quota-e.usage)}catch(_){}$('st').textContent=x}
$('cfg').onclick=()=>{info();sleepLabel();$('dc').showModal()};
$('ex').onclick=()=>{const k={};songs.forEach(s=>k[s.id]=key(s));const o={v:1,fav:songs.filter(s=>s.fav).map(key),pls:{}};for(const n in pls)o.pls[n]=pls[n].map(i=>k[i]).filter(Boolean);
 const u=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='musicas-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),5000)};
$('im').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text()),m=new Map(songs.map(s=>[key(s),s]));let f=0;
 for(const k of o.fav||[]){const s=m.get(k);if(s&&!s.fav){s.fav=true;await tx('readwrite',st=>st.put(s));f++}}
 for(const n in o.pls||{}){pls[n]=pls[n]||[];for(const k of o.pls[n]){const s=m.get(k);if(s&&!pls[n].includes(s.id))pls[n].push(s.id)}}
 saveP();render();alert('Backup importado. Favoritas novas: '+f+'.')}catch(_){alert('Arquivo de backup inválido.')}e.target.value=''};
paintCtl();
dbOpen().then(d=>{db=d;load().then(()=>{restore();tagAll()})});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script></body></html>
